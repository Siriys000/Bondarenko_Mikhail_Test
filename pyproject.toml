[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deribit-price-service"
version = "1.0.0"
description = "Minute index prices from Deribit and a read-only HTTP API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiohttp>=3.11,<4",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/price_service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires an isolated PostgreSQL test database"]
addopts = "--strict-markers -ra"

[tool.coverage.run]
source = ["price_service"]
branch = true

[tool.coverage.report]
show_missing = true
